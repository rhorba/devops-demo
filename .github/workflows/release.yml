name: Release — Tag & Update Charts

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/devops-demo

jobs:
  release:
    name: Tag images and update chart versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag versioned images
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for svc in sensor-simulator api-gateway data-sink enterprise-consumer; do
            docker buildx build \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:$VERSION \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/$svc:latest \
              --push \
              services/$svc
          done

      - name: Update appVersion in service Helm charts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          for svc in sensor-simulator api-gateway data-sink enterprise-consumer; do
            sed -i "s/^appVersion:.*/appVersion: \"$VERSION\"/" services/$svc/chart/Chart.yaml
            sed -i "s/tag: latest/tag: $VERSION/" services/$svc/chart/values.yaml
          done

      - name: Commit chart version bumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add services/*/chart/
          git commit -m "chore(release): bump chart appVersion to ${{ steps.version.outputs.version }}" || echo "No changes"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## DevOps Demo Release ${{ github.ref_name }}

            Images pushed to GHCR:
            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/sensor-simulator:${{ steps.version.outputs.version }}`
            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/api-gateway:${{ steps.version.outputs.version }}`
            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/data-sink:${{ steps.version.outputs.version }}`
            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/enterprise-consumer:${{ steps.version.outputs.version }}`

            ArgoCD will automatically detect and deploy the new image tags.
