# Minimal RBAC for all app services
# Each service gets its own ServiceAccount (already created in Helm charts)
# Here we add only what's truly needed beyond default

# sensor-simulator: no k8s API access needed
# api-gateway: needs to read ConfigMaps (for potential config reload)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-gateway
  namespace: apps
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-gateway
  namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-gateway
subjects:
  - kind: ServiceAccount
    name: api-gateway
    namespace: apps
---
# data-sink: no k8s API access needed
# enterprise-consumer: no k8s API access needed

# Prometheus ServiceAccount (managed by kube-prometheus-stack)
# is already granted ClusterRole prometheus by the chart.

# ArgoCD ServiceAccount already has cluster-admin in platform namespace via chart.
