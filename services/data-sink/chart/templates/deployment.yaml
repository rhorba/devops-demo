apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-sink
  namespace: {{ .Release.Namespace }}
  labels: {{ toYaml .Values.podLabels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-sink
  template:
    metadata:
      labels: {{ toYaml .Values.podLabels | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: data-sink
      securityContext: {{ toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: data-sink
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8080
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-sink
  namespace: {{ .Release.Namespace }}
