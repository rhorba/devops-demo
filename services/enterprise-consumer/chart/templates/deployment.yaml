apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-consumer
  namespace: {{ .Release.Namespace }}
  labels: {{ toYaml .Values.podLabels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-consumer
  template:
    metadata:
      labels: {{ toYaml .Values.podLabels | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: enterprise-consumer
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: enterprise-consumer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8080
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: MQ_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mqSecret.name }}
                  key: {{ .Values.mqSecret.key }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enterprise-consumer
  namespace: {{ .Release.Namespace }}
{{- if .Values.mqSecret.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ibm-mq-app-password
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  password: {{ .Values.mqSecret.password | quote }}
{{- end }}
