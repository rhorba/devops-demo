image:
  repository: localhost:5001/sensor-simulator
  tag: latest
  pullPolicy: Always

env:
  MQTT_BROKER: "tcp://mosquitto.messaging.svc.cluster.local:1883"
  INTERVAL_MS: "1000"
  METRICS_ADDR: ":8080"

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  readOnlyRootFilesystem: true

podLabels:
  app: sensor-simulator
  version: latest
  component: apps
