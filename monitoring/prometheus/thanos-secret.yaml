# Thanos object store config → LocalStack S3
# Applied before ArgoCD syncs (in bootstrap.sh)
apiVersion: v1
kind: Secret
metadata:
  name: thanos-objstore-config
  namespace: observability
type: Opaque
stringData:
  objstore.yml: |
    type: S3
    config:
      bucket: thanos-metrics
      endpoint: localstack.localstack.svc.cluster.local:4566
      region: us-east-1
      access_key: test
      secret_key: test
      insecure: true
      signature_version2: false
      put_user_metadata: {}
      http_config:
        idle_conn_timeout: 90s
        response_header_timeout: 2m
        insecure_skip_verify: true
      trace:
        enable: false
