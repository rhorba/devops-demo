redpanda:
  statefulset:
    replicas: 1
    securityContext:
      runAsNonRoot: true
      runAsUser: 101
      fsGroup: 101
    podTemplate:
      labels:
        app: redpanda
        component: messaging
    sideCars:
      configWatcher:
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
      controllers:
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi

  resources:
    cpu:
      cores: 1
    memory:
      container:
        max: "2Gi"
      redpanda:
        reserveMemory: "256Mi"

  storage:
    persistentVolume:
      enabled: true
      size: 5Gi
      storageClass: standard

  tls:
    enabled: false

  auth:
    sasl:
      enabled: false

  # Kafka-compatible API on port 9092
  listeners:
    kafka:
      port: 9092
    admin:
      port: 9644
    schemaRegistry:
      port: 8081
    http:
      port: 8082

  config:
    cluster:
      auto_create_topics_enabled: true
      default_topic_partitions: 3
      default_topic_replication_factor: 1

  console:
    enabled: false  # console Deployment fails Kyverno (no runAsNonRoot/labels) — not needed for demo

  tuning:
    tune_aio_events: false  # disable privileged init container (Kyverno blocks privileged pods)

  post_install_job:
    enabled: true

  # Pre-create topics
  topics:
    - name: raw.telemetry
      partitions: 3
      replicationFactor: 1
      config:
        retention.ms: "86400000"  # 24h
