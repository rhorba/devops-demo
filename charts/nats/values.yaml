nats:
  config:
    jetstream:
      enabled: true
      memStorage:
        enabled: true
        size: 1Gi
      fileStorage:
        enabled: false
    cluster:
      enabled: false  # single-node for demo

  container:
    image:
      tag: "2.10.14-alpine"
    merge:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

  podTemplate:
    merge:
      metadata:
        labels:
          app: nats
          version: "2.10.14"
          component: messaging
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000

  natsBox:
    enabled: false  # natsBox has no runAsNonRoot — blocked by Kyverno in demo

  promExporter:
    enabled: true
    port: 7778

  service:
    enabled: true
    ports:
      nats:
        enabled: true
      leafnodes:
        enabled: false
      websocket:
        enabled: true
