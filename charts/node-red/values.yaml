# Node-RED chart values
# The deployment, service, and ingress are fully defined in templates/deployment.yaml.
# Override individual fields here if needed.

image:
  repository: nodered/node-red
  tag: "3.1.9"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

ingress:
  enabled: false
  host: nodered.demo.local
  ingressClassName: haproxy
