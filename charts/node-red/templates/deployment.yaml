apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  namespace: {{ .Release.Namespace }}
  labels:
    app: node-red
    version: "3.1.9"
    component: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
        version: "3.1.9"
        component: tools
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: node-red
          image: nodered/node-red:3.1.9
          ports:
            - name: http
              containerPort: 1880
          env:
            - name: NODE_RED_ENABLE_PROJECTS
              value: "false"
            - name: FLOWS
              value: flows.json
          volumeMounts:
            - name: flows
              mountPath: /data/flows.json
              subPath: flows.json
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: flows
          configMap:
            name: node-red-flows
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-red-flows
  namespace: {{ .Release.Namespace }}
data:
  flows.json: |
    [
      {"id":"tab1","type":"tab","label":"Telemetry Monitor"},
      {
        "id":"nats-in",
        "type":"nats-io in",
        "z":"tab1",
        "name":"NATS telemetry.>",
        "server":"nats://nats.messaging.svc.cluster.local:4222",
        "topic":"telemetry.>",
        "x":180,"y":120,"wires":[["json-parse"]]
      },
      {
        "id":"json-parse","type":"json",
        "z":"tab1","name":"Parse JSON",
        "x":380,"y":120,"wires":[["debug-out","dashboard-text"]]
      },
      {
        "id":"debug-out","type":"debug",
        "z":"tab1","name":"Debug","active":true,
        "x":560,"y":100,"wires":[]
      },
      {
        "id":"dashboard-text","type":"ui_text",
        "z":"tab1","name":"Live Reading",
        "group":"dash-group","order":1,
        "format":"Zone: {{msg.payload.zone}} | {{msg.payload.type}}: {{msg.payload.value}} {{msg.payload.unit}}",
        "x":580,"y":140,"wires":[]
      },
      {
        "id":"inject-trigger","type":"inject",
        "z":"tab1","name":"Trigger Test MQTT Msg",
        "repeat":"","crontab":"","once":false,
        "payload":"{\"zone\":\"test\",\"type\":\"manual\",\"value\":42,\"unit\":\"test\"}",
        "payloadType":"json",
        "x":180,"y":240,"wires":[["mqtt-out"]]
      },
      {
        "id":"mqtt-out","type":"mqtt out",
        "z":"tab1","name":"MQTT sensors/test/manual",
        "topic":"sensors/test/manual","qos":"1","retain":"false",
        "broker":"mqtt-broker",
        "x":420,"y":240,"wires":[]
      },
      {
        "id":"mqtt-broker","type":"mqtt-broker",
        "name":"Mosquitto","broker":"mosquitto.messaging.svc.cluster.local",
        "port":"1883","clientid":"node-red-demo",
        "usetls":false,"compatmode":false,"protocolVersion":"4",
        "keepalive":"60","cleansession":true
      }
    ]
---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: {{ .Release.Namespace }}
  labels:
    app: node-red
    component: tools
spec:
  selector:
    app: node-red
  ports:
    - name: http
      port: 1880
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-red
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: haproxy
  rules:
    - host: nodered.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node-red
                port:
                  name: http
