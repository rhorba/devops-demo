apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-connect-pipelines
  namespace: {{ .Release.Namespace }}
data:
  mqtt-to-redpanda.yaml: |
    http:
      address: "0.0.0.0:4195"

    input:
      mqtt:
        urls: ["tcp://mosquitto.messaging.svc.cluster.local:1883"]
        topics: ["sensors/#"]
        client_id: "connect-mqtt-source"
        clean_session: true
        qos: 1

    pipeline:
      processors:
        - log:
            level: DEBUG
            message: 'MQTT→Redpanda: ${! meta("mqtt_topic") }'
        - mapping: |
            root = this
            root.source = "mqtt"
            root.broker = "mosquitto"
            root.routed_at = now()

    output:
      kafka_franz:
        seed_brokers: ["redpanda.messaging.svc.cluster.local:9092"]
        topic: raw.telemetry
        compression: snappy

    metrics:
      prometheus: {}

  redpanda-to-nats.yaml: |
    http:
      address: "0.0.0.0:4195"

    input:
      kafka_franz:
        seed_brokers: ["redpanda.messaging.svc.cluster.local:9092"]
        topics: ["raw.telemetry"]
        consumer_group: "connect-nats-bridge"
        start_offset: latest

    pipeline:
      processors:
        - log:
            level: DEBUG
            message: "Redpanda to NATS: routing telemetry"
        - mapping: |
            root = this
            root.bridge = "redpanda-to-nats"

    output:
      nats_jetstream:
        urls: ["nats://nats.messaging.svc.cluster.local:4222"]
        subject: 'telemetry.${! json("zone") }.${! json("type") }'

    metrics:
      prometheus: {}

  redpanda-to-ibmmq.yaml: |
    http:
      address: "0.0.0.0:4195"

    input:
      kafka_franz:
        seed_brokers: ["redpanda.messaging.svc.cluster.local:9092"]
        topics: ["raw.telemetry"]
        consumer_group: "connect-ibmmq-bridge"
        start_offset: latest

    pipeline:
      processors:
        - mapping: |
            root = this
            root.bridge = "redpanda-to-ibmmq"
            root.enterprise_ts = now()

    # IBM MQ REST Messaging API (AMQP not available in Developer image)
    output:
      http_client:
        url: "https://ibm-mq.messaging.svc.cluster.local:9443/ibmmq/rest/v2/messaging/qmgr/QM1/queue/DEV.QUEUE.1/message"
        verb: POST
        headers:
          Content-Type: "application/json"
          ibm-mq-rest-csrf-token: "x"
        basic_auth:
          enabled: true
          username: app
          password: "${MQ_APP_PASSWORD}"
        tls:
          enabled: true
          skip_cert_verify: true

    metrics:
      prometheus: {}

  redpanda-to-s3.yaml: |
    http:
      address: "0.0.0.0:4195"

    input:
      kafka_franz:
        seed_brokers: ["redpanda.messaging.svc.cluster.local:9092"]
        topics: ["raw.telemetry"]
        consumer_group: "connect-s3-archive"
        start_from_oldest: true

    pipeline:
      processors:
        - mapping: |
            root = this
            root.archived_at = now()

    output:
      aws_s3:
        bucket: telemetry-archive
        path: '${! timestamp_unix() }/${! uuid_v4() }.json'
        endpoint: "http://localstack.localstack.svc.cluster.local:4566"
        region: us-east-1
        force_path_style_urls: true
        credentials:
          id: test
          secret: test

    metrics:
      prometheus: {}
