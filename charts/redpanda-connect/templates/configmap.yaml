apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-connect-pipelines
  namespace: {{ .Release.Namespace }}
data:
  mqtt-to-redpanda.yaml: |
    http:
      address: "0.0.0.0:4195"

    input:
      mqtt:
        urls: ["tcp://mosquitto.messaging.svc.cluster.local:1883"]
        topics: ["sensors/#"]
        client_id: "connect-mqtt-source"
        clean_session: true
        qos: 1

    pipeline:
      processors:
        - log:
            level: DEBUG
            message: 'MQTT→Redpanda: ${! meta("mqtt_topic") }'
        - mapping: |
            root = this
            root.source = "mqtt"
            root.broker = "mosquitto"
            root.routed_at = now()

    output:
      kafka_franz:
        seed_brokers: ["redpanda.messaging.svc.cluster.local:9092"]
        topic: raw.telemetry
        compression: snappy

    metrics:
      prometheus: {}

  redpanda-to-nats.yaml: |
    http:
      address: "0.0.0.0:4195"

    input:
      kafka_franz:
        seed_brokers: ["redpanda.messaging.svc.cluster.local:9092"]
        topics: ["raw.telemetry"]
        consumer_group: "connect-nats-bridge"
        start_from_oldest: false

    pipeline:
      processors:
        - log:
            level: DEBUG
            message: "Redpanda to NATS: routing telemetry"
        - mapping: |
            root = this
            root.bridge = "redpanda-to-nats"

    output:
      nats_jetstream:
        urls: ["nats://nats.messaging.svc.cluster.local:4222"]
        subject: 'telemetry.${! json("zone") }.${! json("type") }'

    metrics:
      prometheus: {}

  redpanda-to-ibmmq.yaml: |
    http:
      address: "0.0.0.0:4195"

    input:
      kafka_franz:
        seed_brokers: ["redpanda.messaging.svc.cluster.local:9092"]
        topics: ["raw.telemetry"]
        consumer_group: "connect-ibmmq-bridge"
        start_from_oldest: false

    pipeline:
      processors:
        - mapping: |
            root = this
            root.bridge = "redpanda-to-ibmmq"
            root.enterprise_ts = now()

    # Uses AMQP 1.0 (port 5672) — available in community image without CGO.
    # enterprise-consumer reads from this same queue via AMQP 1.0.
    output:
      amqp_1:
        url: "amqp://app:${MQ_APP_PASSWORD}@ibm-mq.messaging.svc.cluster.local:5672"
        target_address: "DEV.QUEUE.1"

    metrics:
      prometheus: {}

  redpanda-to-s3.yaml: |
    http:
      address: "0.0.0.0:4195"

    input:
      kafka_franz:
        seed_brokers: ["redpanda.messaging.svc.cluster.local:9092"]
        topics: ["raw.telemetry"]
        consumer_group: "connect-s3-archive"
        start_from_oldest: true

    pipeline:
      processors:
        - mapping: |
            root = this
            root.archived_at = now()

    output:
      aws_s3:
        bucket: telemetry-archive
        path: '${! timestamp_unix() }/${! uuid_v4() }.json'
        endpoint: "http://localstack.localstack.svc.cluster.local:4566"
        region: us-east-1
        force_path_style_urls: true
        credentials:
          id: test
          secret: test

    metrics:
      prometheus: {}
